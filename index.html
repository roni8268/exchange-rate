<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="匯率換算"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>匯率換算</title></head><body><main class="app"><header><div><h1>匯率換算</h1><p id="status">準備中…</p></div><button id="settingsBtn" class="icon-btn">⚙︎</button></header><section class="converter"><div class="currency-card"><button class="currency-select" id="fromBtn"></button><input id="amount" inputmode="decimal" value="1000"></div><button id="swapBtn" class="swap">⇅</button><div class="currency-card"><button class="currency-select" id="toBtn"></button><div id="result" class="result">—</div></div></section><section class="rate-box"><div><span id="rateLabel">1 TWD</span><strong id="rateValue">—</strong></div><button id="modeBtn" class="mode-btn">市場匯率</button></section><section class="quick"><h2>快速換算</h2><div id="quickGrid" class="quick-grid"></div></section><footer><span id="updated">尚未更新匯率</span><button id="refreshBtn">更新匯率</button></footer></main><div id="currencyModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>選擇幣別</h2><button class="close" data-close>×</button></div><div id="currencyList" class="currency-list"></div></div></div><div id="settingsModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>我的匯率</h2><button class="close" data-close>×</button></div><p class="hint">輸入你實際換錢時拿到的比例。資料會儲存在手機，離線也能使用。</p><div id="customInputs"></div><button id="saveCustom" class="primary">儲存</button></div></div><script src="app.js"></script></body></html>
