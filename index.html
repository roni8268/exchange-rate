<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="匯率換算">
  <title>匯率換算</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>匯率換算</h1>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">讀取匯率中…</span></div>
      </div>
      <button id="settingsBtn" class="settings" aria-label="設定">⚙️</button>
    </header>

    <section class="card converter">
      <div class="currency-row">
        <button id="fromBtn" class="currency-btn">🇹🇼 TWD 台幣</button>
        <button id="swapBtn" class="swap" aria-label="交換幣別">⇄</button>
        <button id="toBtn" class="currency-btn">🇰🇷 KRW 韓元</button>
      </div>
      <div class="display-area">
        <div id="expression" class="expression">&nbsp;</div>
        <div id="amount" class="amount">0</div>
        <div id="equals" class="equals">=</div>
        <div id="converted" class="converted">₩0</div>
      </div>
      <div class="rate-row">
        <span id="rateText">1 TWD = — KRW</span>
        <button id="rateModeBtn" class="rate-mode">市場匯率</button>
      </div>
    </section>

    <div id="quickButtons" class="quick"></div>

    <section class="calculator">
      <button class="key function" data-key="clear">AC</button>
      <button class="key function" data-key="back">⌫</button>
      <button class="key function" data-key="sign">±</button>
      <button class="key function" data-key="%">%</button>

      <button class="key number" data-key="7">7</button><button class="key number" data-key="8">8</button><button class="key number" data-key="9">9</button><button class="key operator" data-key="/">÷</button>
      <button class="key number" data-key="4">4</button><button class="key number" data-key="5">5</button><button class="key number" data-key="6">6</button><button class="key operator" data-key="*">×</button>
      <button class="key number" data-key="1">1</button><button class="key number" data-key="2">2</button><button class="key number" data-key="3">3</button><button class="key operator" data-key="-">−</button>
      <button class="key number zero" data-key="0">0</button><button class="key number" data-key=".">.</button><button class="key operator plus" data-key="+">＋</button>
      <button class="key operator equals" data-key="=">＝</button>
    </section>

    <p id="footNote" class="footnote">匯率會自動更新；離線時使用上次儲存的匯率。</p>
  </main>

  <div id="currencyModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h2>選擇幣別</h2><button class="close" data-close="currencyModal">×</button></div>
      <div id="currencyList" class="currency-list"></div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box settings-box">
      <div class="modal-head"><h2>我的匯率</h2><button class="close" data-close="settingsModal">×</button></div>
      <p class="hint">例如你用100 USD換到5800 PHP，就設定「1 USD = 58 PHP」。</p>
      <div class="custom-form">
        <select id="customBase"></select>
        <span>=</span>
        <input id="customRate" type="number" inputmode="decimal" min="0" step="any" placeholder="匯率">
        <select id="customQuote"></select>
      </div>
      <button id="saveRate" class="save-btn">儲存我的匯率</button>
      <div id="savedRates" class="saved-rates"></div>
      <button id="clearCustom" class="danger-btn">清除全部我的匯率</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
